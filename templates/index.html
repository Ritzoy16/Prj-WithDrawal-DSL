<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Banca en Línea</title>
    <style>
        :root { --primary: #007bff; --success: #28a745; --danger: #dc3545; --dark: #343a40; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* --- PANTALLA DE CARGA INICIAL --- */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        .spinner { border: 5px solid #f3f3f3; border-top: 5px solid var(--primary); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- CONTENEDOR PRINCIPAL --- */
        #app-container { width: 100%; max-width: 600px; background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; display: none; }
        
        /* --- CABECERA CON SALDO PERSISTENTE --- */
        header { background: var(--dark); color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .saldo-box { text-align: right; }
        .saldo-box h1 { margin: 0; font-size: 24px; color: #20c997; }
        .saldo-box small { font-size: 12px; color: #adb5bd; }

        /* --- MENÚ DE NAVEGACIÓN --- */
        nav { display: flex; background: #e9ecef; }
        nav button { flex: 1; padding: 15px; border: none; background: none; cursor: pointer; font-weight: bold; color: #495057; transition: 0.3s; }
        nav button:hover { background: #dee2e6; }
        nav button.active { background: white; color: var(--primary); border-bottom: 3px solid var(--primary); }

        /* --- ÁREAS DE CONTENIDO --- */
        .seccion { padding: 30px; display: none; }
        .seccion.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        input, button.btn { width: 100%; padding: 12px; margin-top: 10px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ced4da; }
        button.btn { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button.btn:hover { filter: brightness(0.9); }
        button.btn-retirar { background: var(--danger); }
        button.btn-abonar { background: var(--success); }

        /* --- TABLA DE HISTORIAL --- */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #dee2e6; }
        th { background: #f8f9fa; }
        .tag-exitosa { color: var(--success); font-weight: bold; }
        .tag-rechazada { color: #fd7e14; font-weight: bold; }
        .tag-error { color: var(--danger); font-weight: bold; }

        /* --- MENÚ FLOTANTE (TOAST) --- */
        #toast {
            visibility: hidden; min-width: 250px; background-color: #333; color: #fff;
            text-align: center; border-radius: 5px; padding: 16px; position: fixed;
            z-index: 10000; left: 50%; bottom: 30px; transform: translateX(-50%);
            font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
        
        /* LOADER DE BOTONES */
        .loading-text { font-style: italic; color: #666; text-align: center; display: block; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- 1. PANTALLA DE CARGA -->
    <div id="splash-screen">
        <div class="spinner"></div>
        <h2>Autenticando Datos...</h2>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="app-container">
        <!-- 2. CABECERA CON SALDO PERSISTENTE -->
        <header>
            <div>
                <h3 id="user-name">Cargando...</h3>
                <small>Cajero Automático Web</small>
            </div>
            <div class="saldo-box">
                <small>Saldo Disponible</small>
                <h1 id="saldo-display">$0.00</h1>
            </div>
        </header>

        <!-- 3. MENÚ PREVIO -->
        <nav>
            <button onclick="cambiarSeccion('sec-retiro', this)" class="active">Retirar</button>
            <button onclick="cambiarSeccion('sec-abono', this)">Abonar</button>
            <button onclick="cambiarSeccion('sec-historial', this)">Historial</button>
        </nav>

        <!-- SECCIÓN RETIRO -->
        <div id="sec-retiro" class="seccion active">
            <h2>Realizar Retiro</h2>
            <form id="form-retiro" onsubmit="procesarOperacion(event, '/api/retirar', 'Retirando efectivo...')">
                <input type="number" step="0.01" name="monto" placeholder="Ingrese el monto a retirar" required>
                <button type="submit" class="btn btn-retirar">Confirmar Retiro</button>
                <span class="loading-text" id="load-retiro" style="display:none;">Procesando transacción...</span>
            </form>
        </div>

        <!-- SECCIÓN ABONO -->
        <div id="sec-abono" class="seccion">
            <h2>Realizar Abono</h2>
            <form id="form-abono" onsubmit="procesarOperacion(event, '/api/abonar', 'Procesando abono...')">
                <input type="number" step="0.01" name="monto" placeholder="Ingrese el monto a abonar" required>
                <button type="submit" class="btn btn-abonar">Confirmar Abono</button>
                <span class="loading-text" id="load-abono" style="display:none;">Procesando transacción...</span>
            </form>
        </div>

        <!-- SECCIÓN HISTORIAL (FORMATEADO) -->
        <div id="sec-historial" class="seccion">
            <h2>Historial de Operaciones</h2>
            <div id="tabla-historial-container">Cargando historial...</div>
        </div>
    </div>

    <!-- 4. MENÚ FLOTANTE DE ERRORES / ÉXITO -->
    <div id="toast">Mensaje</div>

    <script>
        // 1. Simular Pantalla de Carga
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash-screen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash-screen').style.display = 'none';
                    document.getElementById('app-container').style.display = 'block';
                    actualizarSaldo();
                }, 500); // Esperar que termine la transición
            }, 2000); // 2 segundos simulando "Autenticación"
        };

        // 2. Cambio de pestañas en el Menú
        function cambiarSeccion(idSeccion, btn) {
            document.querySelectorAll('.seccion').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            
            document.getElementById(idSeccion).classList.add('active');
            btn.classList.add('active');

            if(idSeccion === 'sec-historial') {
                cargarHistorial();
            }
        }

        // 3. Actualizar Saldo en la Cabecera
        async function actualizarSaldo() {
            try {
                const res = await fetch('/api/saldo');
                const data = await res.json();
                document.getElementById('saldo-display').innerText = `$${data.saldo.toFixed(2)}`;
                document.getElementById('user-name').innerText = `Hola, ${data.nombre}`;
            } catch (e) {
                mostrarToast("Error al conectar con el servidor", "error");
            }
        }

        // 4. Procesar Retiro o Abono (con pantalla de carga)
        async function procesarOperacion(event, url, msjCarga) {
            event.preventDefault();
            const form = event.target;
            const formData = new FormData(form);
            const btn = form.querySelector('button');
            const loader = form.querySelector('.loading-text');

            // Simulando Pantalla de Carga en la operación
            btn.disabled = true;
            btn.innerText = "Espere...";
            loader.style.display = 'block';

            // Simulamos un pequeño delay artificial para que el usuario vea la carga
            await new Promise(r => setTimeout(r, 1000));

            try {
                const res = await fetch(url, { method: 'POST', body: formData });
                const data = await res.json();

                if (res.ok) {
                    if (data.status === "success") {
                        mostrarToast(data.mensaje, "success");
                        actualizarSaldo();
                        form.reset();
                    } else {
                        mostrarToast(data.mensaje, "error");
                    }
                } else {
                    mostrarToast(data.error || "Ocurrió un error", "error");
                }
            } catch (err) {
                mostrarToast("Fallo de red", "error");
            } finally {
                btn.disabled = false;
                btn.innerText = "Confirmar";
                loader.style.display = 'none';
            }
        }

        // 5. Cargar y Formatear Historial
        async function cargarHistorial() {
            const contenedor = document.getElementById('tabla-historial-container');
            contenedor.innerHTML = "Cargando...";
            
            try {
                const res = await fetch('/api/historial');
                const data = await res.json(); // Array de transacciones
                
                if (data.length === 0) {
                    contenedor.innerHTML = "<p>No hay transacciones registradas</p>";
                    return;
                }

                let html = `<table>
                    <tr><th>Fecha</th><th>Tipo</th><th>Monto</th><th>Estado</th></tr>`;
                
                // Recorrer el JSON de atrás hacia adelante (la más reciente primero)
                data.reverse().forEach(tx => {
                    let claseEstado = tx.estado === 'EXITOSA' ? 'tag-exitosa' : (tx.estado === 'RECHAZADA' ? 'tag-rechazada' : 'tag-error');
                    let fecha = new Date(tx.fecha).toLocaleString('es-PE');
                    
                    html += `<tr>
                        <td><small>${fecha}</small></td>
                        <td>${tx.tipo}</td>
                        <td>$${tx.monto.toFixed(2)}</td>
                        <td class="${claseEstado}">${tx.estado}</td>
                    </tr>`;
                });
                html += `</table>`;
                contenedor.innerHTML = html;

            } catch (e) {
                contenedor.innerHTML = "<p>Error al cargar el historial</p>";
            }
        }

        // 6. Función para mostrar el Menú Flotante (Toast)
        function mostrarToast(mensaje, tipo) {
            const toast = document.getElementById("toast");
            toast.innerText = mensaje;
            
            // Colores según el tipo
            if (tipo === "success") {
                toast.style.backgroundColor = "var(--success)";
            } else {
                toast.style.backgroundColor = "var(--danger)";
            }

            toast.className = "show";
            
            // Ocultar después de 3 segundos
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }
    </script>
</body>
</html>
